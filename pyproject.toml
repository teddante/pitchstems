[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pitchstems"
version = "0.1.0"
description = "Local-first stem separation and MIDI transcription using open source models."
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "PitchStems contributors" }
]
keywords = ["audio", "midi", "source-separation", "music-information-retrieval", "basic-pitch", "bs-roformer"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia :: Sound/Audio",
  "Topic :: Multimedia :: Sound/Audio :: MIDI",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "mido>=1.3.2",
]

[project.optional-dependencies]
gui = [
  "PySide6>=6.7",
]
win-gpu = [
  "bs-roformer-infer>=0.1.1,<0.2",
  "basic-pitch>=0.4.0",
  "huggingface-hub[hf_xet]>=1.22,<2",
  "onnxruntime-gpu[cuda,cudnn]>=1.23.2,<1.24",
  # Basic Pitch -> resampy imports pkg_resources, which setuptools 82 removed.
  "setuptools<82",
  "torch>=2.12.1,<2.13",
]
cpu = [
  "bs-roformer-infer>=0.1.1,<0.2",
  "basic-pitch[onnx]>=0.4.0",
  "huggingface-hub[hf_xet]>=1.22,<2",
  # Basic Pitch -> resampy imports pkg_resources, which setuptools 82 removed.
  "setuptools<82",
]
dev = [
  "build>=1.2",
  "mypy>=1.15",
  "pillow>=12.2,<13",
  "pip-audit>=2.9",
  "pytest>=8.0",
  "pytest-cov>=6.0",
  "ruff>=0.6",
  "vulture>=2.16",
]

[project.scripts]
pitchstems = "pitchstems.cli:main"

[project.gui-scripts]
pitchstems-gui = "pitchstems.gui_entry:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pitchstems"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
files = ["src/pitchstems"]
# Qt-bound GUI modules take an untyped MainWindow and are covered by tests and
# the GUI smoke run instead; everything else, including the typed GUI helpers
# named in the lookahead, is type-checked.
exclude = '(^|/)(gui_(?!editor_actions|entry|jobs|theme)[a-z_]+|app|harmony_panel|harmony_report)\.py$'
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[[tool.mypy.overrides]]
module = ["mido", "onnxruntime", "bs_roformer", "bs_roformer.*"]
ignore_missing_imports = true
